# Fly.io (https://fly.io) — memakai volume tetap untuk penyimpanan berkas JSON.
# Langkah: fly launch --no-deploy  (lalu)  fly volumes create arena_data -s 1  (lalu)  fly deploy
app = "arena-juara"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "arena_data"
  destination = "/data"
